<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <main class="container">
        <h1>Box Sizing</h1>

        <section class="boxes">
            <div class="box content-box">
                <h2>Content Box</h2>
                <p>Default box-sizing is content-box.</p>
                <p>Padding and border are added to the width.</p>
            </div>

            <div class="box border-box">
                <h2>Border Box</h2>
                <p>box-sizing is border-box.</p>
                <p>Padding and border are included in the width.</p>
            </div>
        </section>
    </main>

</body>
</html>

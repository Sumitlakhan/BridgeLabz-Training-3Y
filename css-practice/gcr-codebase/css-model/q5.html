<!DOCTYPE html>

    <title>Advanced Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

<header>
    <h1>Advanced CSS Selectors</h1>
</header>

<main>

    <section class="content">

        <h2>Items</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>Java</li>
            <li>SQL</li>
        </ul>

        <div class="box">
            <p>Paragraph inside div.</p>
            <span>Span inside div.</span>
        </div>

        <p>Paragraph after div.</p>
        <p>Another paragraph.</p>

        <form>
            <input type="text" placeholder="Enter name">
            <input type="email" placeholder="Enter email">
        </form>

        <a href="https://www.google.com">Secure Link</a>

    </section>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

<header>
    <h1>CSS Box Model</h1>
</header>

<main>

    <section class="box-model">

        <div class="margin">
            <span>Margin</span>

            <div class="border">
                <span>Border</span>

                <div class="padding">
                    <span>Padding</span>

                    <div class="content">
                        Content
                    </div>

                </div>

            </div>

        </div>

    </section>

    <section class="description">
        <p><strong>Content:</strong> Actual text or element content.</p>
        <p><strong>Padding:</strong> Space between content and border.</p>
        <p><strong>Border:</strong> Line surrounding padding and content.</p>
        <p><strong>Margin:</strong> Space outside the border.</p>
    </section>

</main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

<header>
    <h1>Borders and Padding</h1>
</header>

<main>
    <section class="boxes">
        <div class="box solid">
            <h2>Solid</h2>
            <p>Solid border</p>
        </div>

        <div class="box dashed">
            <h2>Dashed</h2>
            <p>Dashed border</p>
        </div>

        <div class="box double">
            <h2>Double</h2>
            <p>Double border</p>
        </div>

        <div class="box groove">
            <h2>Groove</h2>
            <p>Groove border</p>
        </div>
    </section>

    <section class="padding-demo">
        <div class="small-padding">Small Padding</div>
        <div class="medium-padding">Medium Padding</div>
        <div class="large-padding">Large Padding</div>
    </section>
</main>

<footer>
    <p>Borders and Padding Practice</p>
</footer>

</body>
</html>

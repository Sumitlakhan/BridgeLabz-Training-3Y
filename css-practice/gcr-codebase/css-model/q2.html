<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

<header>
    <h1>Height and Width Practice</h1>
</header>

<main>
    <section class="container">

        <div class="box box1">
            <h2>Pixels</h2>
            <p>Width: 200px</p>
            <p>Height: 150px</p>
        </div>

        <div class="box box2">
            <h2>Percentage</h2>
            <p>Width: 30%</p>
            <p>Height: 30vh</p>
        </div>

        <div class="box box3">
            <h2>EM</h2>
            <p>This box demonstrates em units.</p>
            <p>Extra text is added to demonstrate overflow property.</p>
            <p>More content inside this box.</p>
        </div>

    </section>
</main>

</body>
</html>

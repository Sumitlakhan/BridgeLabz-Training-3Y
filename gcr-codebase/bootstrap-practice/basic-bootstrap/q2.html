<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="q2.css">
</head>

<body class="bg-light text-dark">

<header class="bg-dark text-white text-center p-5">
    <h1 class="fw-bold">Sumit Kumar Sharma</h1>
    <p class="lead">Cybersecurity Student & Developer</p>
</header>

<main>

<section class="container text-center mt-4 mb-3">

    <img src="https://picsum.photos/250"
         class="img-fluid rounded-circle profile-img"
         alt="Profile">

    <h2 class="mt-4 fw-bold">
        Hello, I'm Sumit
    </h2>

    <p>
        I am passionate about Cybersecurity, Java, Web Development
        and Cloud Computing.
    </p>

    <button class="btn btn-primary me-2">
        Hire Me
    </button>

    <button class="btn btn-outline-dark">
        Download CV
    </button>

</section>

<section class="container mt-4 pb-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <h3 class="text-center mb-3">
                Contact Me
            </h3>

            <form>

                <input type="text"
                       class="form-control mb-3"
                       placeholder="Your Name">

                <input type="email"
                       class="form-control mb-3"
                       placeholder="Your Email">

                <textarea class="form-control mb-3"
                          rows="4"
                          placeholder="Your Message"></textarea>

                <button class="btn btn-success w-100">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</section>

</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 Sumit Kumar Sharma
</footer>

</body>
</html>

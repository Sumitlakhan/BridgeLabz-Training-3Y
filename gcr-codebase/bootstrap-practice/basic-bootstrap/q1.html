<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechNova - Company Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="q1.css">
</head>

<body>

    <!-- Header + Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <!-- Company Name -->
                <a class="navbar-brand fw-bold" href="#">
                    TechNova
                </a>

                <!-- Mobile Menu Button -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navigation Links -->
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>


    <!-- Hero Section -->
    <main>

        <section class="hero-section">

            <!-- Bootstrap container -->
            <div class="container">

                <!-- Bootstrap row -->
                <div class="row align-items-center min-vh-75">

                    <!-- Bootstrap column -->
                    <div class="col-lg-7 col-md-8 text-center text-md-start">

                        <h1 class="display-4 fw-bold">
                            Build Your Future With TechNova
                        </h1>

                        <p class="lead mt-3 mb-4">
                            We create modern digital solutions that help
                            businesses grow, innovate and succeed.
                        </p>

                        <a href="#" class="btn btn-primary btn-lg">
                            Get Started
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            © 2026 TechNova. All Rights Reserved.
        </p>
    </footer>


    <!-- Bootstrap JavaScript -->
    <!-- Required for responsive navbar toggle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>

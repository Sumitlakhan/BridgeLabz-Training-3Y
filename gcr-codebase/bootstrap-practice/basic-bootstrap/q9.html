<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Pagination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="q9.css">
</head>

<body>

<header class="bg-dark text-white text-center p-5">

    <h1>My Tech Blog</h1>

    <p class="lead">
        Latest articles and tutorials
    </p>

</header>

<main class="container py-5">

    <div class="row g-4">

        <article class="col-md-6">
            <div class="card h-100 shadow-sm">

                <div class="card-body">

                    <h2>Learn Java</h2>

                    <p>
                        Learn Java programming and object-oriented
                        programming concepts.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>

                </div>

            </div>
        </article>

        <article class="col-md-6">
            <div class="card h-100 shadow-sm">

                <div class="card-body">

                    <h2>Learn Cybersecurity</h2>

                    <p>
                        Understand networking, security and
                        penetration testing basics.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>

                </div>

            </div>
        </article>

    </div>


    <!-- Pagination -->
    <nav class="mt-5">

        <ul class="pagination justify-content-center">

            <li class="page-item">
                <a class="page-link" href="#">
                    Previous
                </a>
            </li>

            <li class="page-item active">
                <a class="page-link" href="#">
                    1
                </a>
            </li>

            <li class="page-item">
                <a class="page-link" href="#">
                    2
                </a>
            </li>

            <li class="page-item">
                <a class="page-link" href="#">
                    Next
                </a>
            </li>

        </ul>

    </nav>


    <!-- Pager -->
    <div class="d-flex justify-content-between mt-4">

        <button class="btn btn-outline-secondary">
            ← Older Posts
        </button>

        <button class="btn btn-outline-secondary">
            Newer Posts →
        </button>

    </div>

</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 My Tech Blog
</footer>

</body>
</html>

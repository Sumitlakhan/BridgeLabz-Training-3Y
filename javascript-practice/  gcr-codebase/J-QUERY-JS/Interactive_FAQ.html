
<!DOCTYPE html>
<html>
<head>
    <title>Interactive FAQ</title>
    <style>
        .question {
            cursor: pointer;
            padding: 10px;
        }

        .answer {
            display: none;
            padding: 10px;
            background: lightgray;
        }
    </style>
</head>
<body>
    <h1>Frequently Asked Questions</h1>

    <div class="faq">
        <h3 class="question">What is jQuery?</h3>

            <input type="text" placeholder="Your answer">
        </div>
    </div>

    <div class="faq">
        <h3 class="question">What is HTML?</h3>
        <div class="answer">
            <p>HTML creates web page structure.</p>
            <input type="text" placeholder="Your answer">
        </div>
    </div>

    <div class="faq">
        <h3 class="question">What is CSS?</h3>
        <div class="answer">
            <p>CSS styles web pages.</p>
            <input type="text" placeholder="Your answer">
        </div>
    </div>

    <div class="faq">
        <h3 class="question">What is JavaScript?</h3>
        <div class="answer">
            <p>JavaScript adds interactivity.</p>
            <input type="text" placeholder="Your answer">
        </div>
    </div>

    <div class="faq">
        <h3 class="question">What is an event?</h3>
        <div class="answer">
            <p>An event is an action performed by a user.</p>
            <input type="text" placeholder="Your answer">
        </div>
    </div>

</html>

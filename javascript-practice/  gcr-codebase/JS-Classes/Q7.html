<!DOCTYPE html>
<html>
<body>

<h2>Login Form</h2>

<form id="loginForm">
    Username: <input type="text" id="username"><br><br>
    Password: <input type="password" id="password"><br><br>

    <button type="submit">Login</button>
</form>

<p id="result"></p>

<script>
"use strict";

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    let errors = [];

    if (!/^.{5,}$/.test(username)) {
        errors.push("Username must have at least 5 characters");
    }

    if (!/^(?=.*[0-9])(?=.*[A-Z])(?=.*[a-z])(?=.*[^A-Za-z0-9]).{8,}$/.test(password)) {
        errors.push("Password must have 8 characters, uppercase, lowercase, number and special character");
    }

    document.getElementById("result").innerHTML =
        errors.length === 0 ? "Login Successful" : errors.join("<br>");
});
</script>

</body>
</html>
